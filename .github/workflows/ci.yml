
name: Workflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Validate preprocessing dataset
        run: |
          test -f MLProject/preprocessed_data.csv
          python -c "import pandas as pd; df = pd.read_csv('MLProject/preprocessed_data.csv'); assert not df.empty, 'Dataset kosong'; print('Dataset shape:', df.shape)"

      - name: Start MLflow Tracking Server
        run: |
          cd MLProject
          mkdir -p mlartifacts
          nohup mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlartifacts \
            > mlflow_server.log 2>&1 &

      - name: Wait for MLflow Server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "MLflow server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MLflow server failed to start"
          cat MLProject/mlflow_server.log
          exit 1

      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Upload clustering results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-superyachts-clustering-results
          path: |
            MLProject/hasil_clustering.csv
            MLProject/ringkasan_cluster.csv
            MLProject/mlflow.db
            MLProject/mlflow_server.log
          if-no-files-found: warn
