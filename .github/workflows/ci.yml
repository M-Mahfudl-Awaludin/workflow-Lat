name: Workflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.22.0
          pip install scikit-learn==1.6.1
          pip install pandas==2.2.3
          pip install numpy==2.2.4

      - name: Validate project files
        run: |
          test -f MLProject/MLproject
          test -f MLProject/modelling.py
          test -f MLProject/conda.yaml
          test -f MLProject/titanic_preprocessing_train.csv
          test -f MLProject/titanic_preprocessing_test.csv
          echo "Semua file MLProject tersedia."

      - name: Validate Python syntax
        run: |
          python -m py_compile MLProject/modelling.py
          echo "Sintaks Python valid."

      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          mlflow run . --env-manager=local

      - name: Upload training results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanic-training-results
          path: |
            MLProject/hasil_prediksi_titanic.csv
            MLProject/classification_report.txt
            MLProject/confusion_matrix.csv
          if-no-files-found: ignore